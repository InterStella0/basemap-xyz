server {
    listen 80;
    server_name _;

    # Docker's internal DNS, with the upstream held in a variable so a restarted api container is
    # re-resolved instead of pinning nginx to a dead IP at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream "${API_HOST}:3000";

    # Written by docker-entrypoint.sh from TRUSTED_PROXY_CIDR; empty unless it is set. Named .inc
    # rather than .conf so the http-level conf.d glob does not pick it up as a server block.
    include /etc/nginx/conf.d/real_ip.inc;

    root /var/www/site;
    index index.html;

    # ---- tiles -------------------------------------------------------------------------------
    # The hit path. The API writes {layer}/{z}/{x}/{y}.png into this same volume (see
    # cache_path() in src/tiles.rs — the two layouts must stay identical), so a cached tile is
    # answered here by sendfile and never reaches Rust at all. Only a miss falls through to
    # @render. The layer charset mirrors TileCoord::validate()'s InvalidLayer check in Rust, so a
    # path-traversal attempt in the layer segment never reaches try_files either.
    location ~ ^/tiles/(?<layer>[A-Za-z0-9_.-]+)/(?<tz>\d+)/(?<tx>\d+)/(?<ty>\d+)\.png$ {
        root /var/cache/tiles;
        try_files /$layer/$tz/$tx/$ty.png @render;

        # `always` throughout: without it nginx applies add_header only to a success-status
        # allowlist, so an error response would silently lose its CORS header and a browser client
        # would see an opaque CORS failure instead of the actual status.
        add_header Cache-Control "public, max-age=604800" always;
        # Required by MapLibre, OpenLayers and anything that reads tiles back off a canvas.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Tile-Cache "HIT" always;
        # A busy basemap would otherwise write gigabytes of near-identical log lines.
        access_log off;
    }

    location @render {
        limit_req zone=tile_render burst=60 nodelay;
        limit_req_status 429;
        limit_conn tile_conn 64;
        limit_conn_status 429;

        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # A cold tile is a live QGIS render; it needs longer than a normal proxy timeout, but not
        # so long that a stuck renderer holds connections open indefinitely.
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;

        # A miss can legitimately answer 502/503/429; those must still carry CORS, or a browser
        # reports a CORS error and hides the real reason from the developer.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Tile-Cache "MISS" always;
    }

    # ---- service endpoints -------------------------------------------------------------------
    location = /health/live {
        proxy_pass http://$api_upstream/health/live;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health {
        proxy_pass http://$api_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /stats {
        proxy_pass http://$api_upstream/stats;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- the site ----------------------------------------------------------------------------
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
