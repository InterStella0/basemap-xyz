user nginx;
worker_processes auto;
# One tile is one file descriptor; a basemap under load holds a lot of them open at once.
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct="$upstream_connect_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # Serving cache hits is the entire hot path, and it is all small static files.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Metadata cache for the tile directory. Without it every single-host hit costs an
    # open()+fstat(). In the swarm the directory is absent and nginx proxies everything, so
    # this cache is simply unused there.
    open_file_cache max=200000 inactive=5m;
    open_file_cache_valid 2m;
    open_file_cache_min_uses 1;
    # Load-bearing, not tidiness. Left on (the default), nginx caches the ENOENT from a miss and
    # keeps routing to @render for minutes after the API has already written the tile.
    open_file_cache_errors off;

    client_max_body_size 1m;
    client_body_timeout 30s;

    # Tile traffic is rate limited. On a single host, hits are sendfile'd before these limits
    # are reached, so they only throttle cold renders; in the swarm every tile is a proxy hop
    # to the api on the home box, hence the looser rate. A burst absorbs a client opening a
    # fresh view (~20 tiles) without throttling a real user.
    #
    # These key on $binary_remote_addr, which behind a CDN or load balancer is the *edge's* address
    # — every visitor would then share one bucket and throttle each other. Set TRUSTED_PROXY_CIDR
    # so the real client address is recovered first (see docker-entrypoint.sh). It is unset by
    # default because trusting X-Forwarded-For from an untrusted source lets anyone spoof their way
    # past these limits.
    limit_req_zone $binary_remote_addr zone=tile_render:16m rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=tile_conn:16m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    # Deliberately no image/png: PNG is already compressed, so gzipping tiles burns CPU for nothing.
    gzip_types text/plain text/css text/xml application/javascript application/json
               image/svg+xml application/xml+rss font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/*.conf;
}
